<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FST Settat</title>
  <style>
    :root { --panel: rgba(18,22,28,.88); --fg: #eef1f4; --muted: #9aa5b1; --accent: #ffb000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--fg); background: #0f1318; }
    #viewport { position: absolute; inset: 0; cursor: grab; }
    #viewport:active { cursor: grabbing; }
    #viewport canvas { display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

    #hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; max-width: 95vw; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    #hint b { color: var(--fg); font-weight: 600; }
    #error { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); color: #fff; padding: 30px; text-align: center; }

    .lbl { color: #fff; background: rgba(20,24,30,.78); padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; text-shadow: 0 1px 2px #000; }
    .lbl-named_in_model { border-color: #e8d6b0; }
    .lbl-provisional { border-color: #ff7a00; background: rgba(90,45,0,.82); }
    .lbl-unidentified { border-color: #999; background: rgba(50,50,50,.75); font-weight: 500; }
    .lbl-outside_model { border-color: #6aa0bd; background: rgba(20,45,60,.78); font-weight: 500; }
    .lbl-place { background: rgba(35,90,40,.7); font-weight: 500; font-style: italic; }
    .lbl-entrance { background: rgba(255,176,0,.92); color: #1b1300; text-shadow: none; }
    .lbl-road { background: rgba(0,0,0,.45); font-weight: 400; font-size: 10px; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="labels"></div>
  <div id="hint"><b>ZQSD</b> se déplacer · <b>Maj</b> courir · <b>Espace</b> sauter · <b>glisser / ← →</b> regarder · <b>O</b> noms des lieux : <b id="namesState">oui</b></div>
  <div id="error"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
