<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FST Settat</title>
  <style>
    :root { --panel: rgba(18,22,28,.88); --fg: #eef1f4; --muted: #9aa5b1; --accent: #ffb000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--fg); background: #0f1318; }
    #viewport { position: absolute; inset: 0; cursor: grab; }
    #viewport:active { cursor: grabbing; }
    #viewport canvas { display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

    #hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; max-width: 95vw; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    #hint b { color: var(--fg); font-weight: 600; }
    #error { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); color: #fff; padding: 30px; text-align: center; }

    /* v0.8 : door prompt, fade, place banner */
    #prompt { position: absolute; left: 50%; bottom: 52px; transform: translate(-50%, 8px); display: flex; align-items: center; gap: 7px; background: rgba(14,18,24,.82); border: 1px solid rgba(255,176,0,.4); color: var(--fg); padding: 4px 10px 4px 5px; border-radius: 8px; font-size: 12px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
    #prompt.on { opacity: 1; transform: translate(-50%, 0); }
    #prompt .key { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(#ffd25a, #ffa800); color: #231600; font-weight: 800; font-size: 12px; box-shadow: 0 1px 0 #b57400; }
    #prompt .where { color: var(--accent); font-weight: 600; }
    #prompt .where:not(:empty)::before { content: "· "; color: var(--muted); }
    #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    #fade.on { opacity: 1; }
    #banner { position: absolute; left: 50%; top: 9%; transform: translate(-50%, -8px); padding: 10px 26px; background: rgba(14,18,24,.78); border-left: 4px solid var(--accent); border-radius: 6px; font-size: 22px; font-weight: 700; letter-spacing: .02em; opacity: 0; pointer-events: none; transition: opacity .45s, transform .45s; }
    #banner.on { opacity: 1; transform: translate(-50%, 0); }

    .lbl { color: #fff; background: rgba(20,24,30,.78); padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; text-shadow: 0 1px 2px #000; }
    .lbl-named_in_model { border-color: #e8d6b0; }
    .lbl-provisional { border-color: #ff7a00; background: rgba(90,45,0,.82); }
    .lbl-unidentified { border-color: #999; background: rgba(50,50,50,.75); font-weight: 500; }
    .lbl-outside_model { border-color: #6aa0bd; background: rgba(20,45,60,.78); font-weight: 500; }
    .lbl-place { background: rgba(35,90,40,.7); font-weight: 500; font-style: italic; }
    .lbl-entrance { background: rgba(255,176,0,.92); color: #1b1300; text-shadow: none; }
    .lbl-road { background: rgba(0,0,0,.45); font-weight: 400; font-size: 10px; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="labels"></div>
  <div id="prompt"><span class="key">K</span><span>Appuyez sur K pour <span class="act">entrer</span></span><span class="where"></span></div>
  <div id="banner"></div>
  <div id="fade"></div>
  <div id="hint"><b>ZQSD</b> se déplacer · <b>Maj</b> courir · <b>Espace</b> sauter · <b>glisser / ← →</b> regarder · <b>K</b> entrer / sortir (près d'une porte ▼) · <b>O</b> noms des lieux : <b id="namesState">oui</b></div>
  <div id="error"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
